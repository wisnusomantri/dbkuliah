<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Database Tugas Kuliah</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #4F46E5; }

  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: linear-gradient(135deg, #4F46E5 0%, #6366F1 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    z-index: 10;
    transition: opacity .4s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  .spinner {
    width: 42px;
    height: 42px;
    border: 4px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader p { font-size: 14px; opacity: .9; }

  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
  }

  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  #fallback a {
    background: #4F46E5;
    color: #fff;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
  }
</style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p>Memuat aplikasi…</p>
  </div>

  <iframe
    id="app-frame"
    title="Database Tugas Kuliah"
    allow="clipboard-write"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <div id="fallback">
    <p>Jika aplikasi tidak muncul, buka langsung melalui tautan berikut:</p>
    <a id="fallback-link" href="#" target="_blank" rel="noopener">Buka Aplikasi</a>
  </div>

  <!-- ====================================================
       GANTI URL WEB APP DI SINI SAAT LINK BERUBAH
       (satu-satunya tempat yang perlu diedit)
  ==================================================== -->
  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbxdn40Pm_KuZK7r2bMrHjVNJT8Kmcag6vS0ITa_itapRUkMd_-aBTZnpUwzDJwQyc6d/exec";

    var loader = document.getElementById('loader');
    var frame = document.getElementById('app-frame');
    var fallback = document.getElementById('fallback');
    var fallbackLink = document.getElementById('fallback-link');
    var loaded = false;

    frame.src = APP_URL;
    fallbackLink.href = APP_URL;

    frame.addEventListener('load', function () {
      loaded = true;
      loader.classList.add('hide');
      setTimeout(function () { loader.style.display = 'none'; }, 400);
    });

    // Jika dalam 10 detik iframe belum termuat, tampilkan fallback (kemungkinan diblokir)
    setTimeout(function () {
      if (!loaded) {
        loader.style.display = 'none';
        frame.style.display = 'none';
        fallback.style.display = 'flex';
      }
    }, 10000);
  </script>

</body>
</html>
